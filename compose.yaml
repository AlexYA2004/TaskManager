services:
  taskmanager.api:
    image: taskmanager.api
    build:
      context: .
      dockerfile: TaskManager.API/Dockerfile
    ports:
      - "5000:80"
    depends_on:
      - elasticsearch
      - redis
#  taskmanager.dal:
#    image: taskmanager.dal
#    build:
#      context: .
#      dockerfile: TaskManager.DAL/Dockerfile

  taskmanager.dal:
    image: taskmanager.dal
    build:
      context: .
      dockerfile: TaskManager.DAL/Dockerfile
      
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  elasticsearch:
    image: elasticsearch:8.12.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      - xpack.license.self_generated.type=basic
    ports:
      - "9200:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data

  kibana:
    image: kibana:8.12.0
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_PUBLICBASEURL=http://localhost:5601 
      - SERVER_SSL_ENABLED=false
      - CSP_STRICT=false
      - ELASTICSEARCH_SSL_VERIFICATIONMODE=none
      - XPACK_AI_ASSISTANT_ENABLED=false
      - XPACK_ML_ENABLED=false
      - XPACK_SCREENSHOTTING_BROWSER_CHROMIUM_DISABLESANDBOX=true
      - XPACK_ACTIONS_EMAIL_ENABLED=false
    depends_on:
      - elasticsearch

volumes:
  elastic_data:
  redis_data: